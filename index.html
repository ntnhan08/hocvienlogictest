<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Học Viện Logic – Tập Trung Cao Độ</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    body {
      background: #2b1e10;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      touch-action: manipulation;
      background-image: radial-gradient(ellipse at center, #3e2b16 0%, #1f1308 100%);
    }
    .canvas-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    canvas {
      display: block;
      border-radius: 2px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.7), inset 0 0 0 4px #a68b5b;
      background: #f4ecd8;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
  </style>
</head>
<body>
  <div class="canvas-container" id="container">
    <canvas id="gameCanvas" aria-label="Học Viện Logic – Phiên bản tập trung cao độ"></canvas>
  </div>
  <script>
    (function() {
      const container = document.getElementById('container');
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      let W, H;
      let dpr = Math.min(window.devicePixelRatio || 1, 2);

      // Distraction & animation
      let distractionTimer = 0;
      let distractionElements = [];
      let shakeAmount = 0;
      let noiseAlpha = 0;
      let animFrame = 0;

      function resizeCanvas() {
        const rect = container.getBoundingClientRect();
        const containerWidth = rect.width;
        const containerHeight = rect.height;

        const targetRatio = 9 / 16; // tỉ lệ canvas (dọc)
        const maxWidth = 500;
        const maxHeight = maxWidth / targetRatio; // ~888

        let canvasWidth, canvasHeight;

        // Tính toán để canvas vừa khít container, giữ tỉ lệ và không vượt max
        const containerRatio = containerWidth / containerHeight;

        if (containerRatio > targetRatio) {
          // Container rộng hơn tỉ lệ → ưu tiên chiều cao
          canvasHeight = Math.min(containerHeight, maxHeight);
          canvasWidth = canvasHeight * targetRatio;
          if (canvasWidth > containerWidth) {
            canvasWidth = containerWidth;
            canvasHeight = canvasWidth / targetRatio;
          }
        } else {
          // Container hẹp hơn (dọc) → ưu tiên chiều rộng
          canvasWidth = Math.min(containerWidth, maxWidth);
          canvasHeight = canvasWidth / targetRatio;
          if (canvasHeight > containerHeight) {
            canvasHeight = containerHeight;
            canvasWidth = canvasHeight * targetRatio;
          }
        }

        W = Math.round(canvasWidth);
        H = Math.round(canvasHeight);

        dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = W * dpr;
        canvas.height = H * dpr;
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.scale(dpr, dpr);

        canvas.style.width = W + 'px';
        canvas.style.height = H + 'px';

        drawAll();
      }

      window.addEventListener('resize', resizeCanvas);
      window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 120));

      // Audio
      let audioCtx = null;
      function initAudio() { if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audioCtx = null; } } if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(() => {}); }
      function beep(f, d = 80, t = 'sine', v = 0.04) { if (!audioCtx) return; try { const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.type = t; o.frequency.value = f; g.gain.setValueAtTime(v, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + d/1000); o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime + d/1000); } catch (e) {} }
      function playClick() { beep(520, 30, 'sine', 0.04); }
      function playSuccess() { beep(700, 80, 'sine', 0.07); setTimeout(() => beep(900, 80, 'sine', 0.07), 70); }
      function playError() { beep(180, 140, 'triangle', 0.08); beep(90, 200, 'sawtooth', 0.05); }
      function playUrgent() { beep(300, 50, 'square', 0.06); }
      function playDistraction() { beep(60 + Math.random()*50, 30, 'sawtooth', 0.02); }

      function updateDistractions() {
        const gi = parseInt(currentView.replace('game', ''));
        if (isNaN(gi) || !g[gi]?.active) return;
        distractionTimer++;
        if (distractionTimer % 30 === 0) {
          distractionElements.push({
            x: Math.random() * W, y: Math.random() * H,
            vx: (Math.random() - 0.5) * 2, vy: (Math.random() - 0.5) * 2,
            life: 50 + Math.random() * 90,
            char: String.fromCharCode(33 + Math.floor(Math.random() * 90)),
            size: 8 + Math.random() * 20,
            color: `rgba(${Math.floor(Math.random()*120)},${Math.floor(Math.random()*90)},${Math.floor(Math.random()*70)},${0.15+Math.random()*0.35})`
          });
          if (distractionElements.length > 12) distractionElements.shift();
        }
        for (let d of distractionElements) {
          d.x += d.vx; d.y += d.vy; d.life--;
          if (d.x < -30 || d.x > W+30) d.vx *= -1;
          if (d.y < -30 || d.y > H+30) d.vy *= -1;
          d.size *= 0.998;
        }
        distractionElements = distractionElements.filter(d => d.life > 0);
        if (distractionTimer % 60 === 0 && Math.random() < 0.4) {
          shakeAmount = Math.max(shakeAmount, 1.5 + Math.random()*3);
          noiseAlpha = Math.max(noiseAlpha, 0.03 + Math.random()*0.05);
          playDistraction();
        }
        shakeAmount *= 0.92;
        noiseAlpha *= 0.88;
        if (shakeAmount < 0.08) shakeAmount = 0;
        if (noiseAlpha < 0.002) noiseAlpha = 0;
      }

      function drawDistractions(ctx) {
        for (let d of distractionElements) {
          ctx.save();
          ctx.globalAlpha = d.life / 140;
          ctx.fillStyle = d.color;
          setFont(d.size, 'bold');
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(d.char, d.x, d.y);
          ctx.restore();
        }
        if (noiseAlpha > 0.002) {
          ctx.fillStyle = `rgba(20,10,5,${noiseAlpha})`;
          for (let i = 0; i < 35; i++) {
            ctx.fillRect(Math.random()*W, Math.random()*H, Math.random()*4+1, Math.random()*3+1);
          }
        }
      }

      function drawOrnateBorder() {
        ctx.strokeStyle = '#5c4a32';
        ctx.lineWidth = 5;
        ctx.strokeRect(3, 3, W - 6, H - 6);
        ctx.strokeStyle = '#b8a56a';
        ctx.lineWidth = 2;
        ctx.strokeRect(8, 8, W - 16, H - 16);
        const s = Math.min(W, H) * 0.07;
        const corners = [
          { x: 12, y: 12, rot: 0 }, { x: W - 12, y: 12, rot: Math.PI/2 },
          { x: W - 12, y: H - 12, rot: Math.PI }, { x: 12, y: H - 12, rot: -Math.PI/2 }
        ];
        corners.forEach(c => {
          ctx.save();
          ctx.translate(c.x, c.y);
          ctx.rotate(c.rot);
          ctx.strokeStyle = '#b8a56a';
          ctx.lineWidth = 1.8;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.quadraticCurveTo(s*0.5, -s*0.6, s*1.1, -s*0.2);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.quadraticCurveTo(-s*0.6, s*0.4, -s*0.2, s*1.0);
          ctx.stroke();
          ctx.restore();
        });
      }

      function drawParchmentBackground() {
        const grad = ctx.createLinearGradient(0, 0, 0, H);
        grad.addColorStop(0, '#fef9ee');
        grad.addColorStop(0.4, '#f7e9cc');
        grad.addColorStop(0.8, '#f2dfb5');
        grad.addColorStop(1, '#e9d4a8');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, W, H);
        drawOrnateBorder();
      }

      function drawTopBar(title, score, level, timeLeft, totalTime) {
        const barH = H * 0.08;
        const pad = W * 0.05;
        const barY = pad * 0.4;
        ctx.fillStyle = '#3a2510';
        ctx.strokeStyle = '#1e0f04';
        ctx.lineWidth = 2.5;
        roundRect(pad - 2, barY - 2, W - 2*pad + 4, barH + 4, 6, true, true);
        ctx.fillStyle = '#1c2a1c';
        roundRect(pad, barY, W - 2*pad, barH, 4, true, false);

        setFont(barH * 0.26, 'bold');
        ctx.fillStyle = '#e8e0c8';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText(title, pad * 2.5, barY + barH * 0.32);

        setFont(barH * 0.16);
        ctx.fillStyle = '#c8c0a8';
        ctx.fillText('Cấp ' + level + '  •  Điểm: ' + score, pad * 2.5, barY + barH * 0.68);

        const barWidth = W * 0.4;
        const barX = W - pad - barWidth - pad * 0.5;
        const barThick = barH * 0.45;
        const barProgressY = barY + barH/2 - barThick/2;
        const pct = Math.max(0, timeLeft / totalTime);
        const barColor = pct > 0.35 ? '#8ca060' : pct > 0.12 ? '#c9a030' : '#b04a40';
        ctx.fillStyle = '#2e2a20';
        roundRect(barX, barProgressY, barWidth, barThick, barThick*0.4, true, false);
        ctx.fillStyle = barColor;
        if (pct > 0.005) roundRect(barX, barProgressY, barWidth * pct, barThick, barThick*0.4, true, false);

        setFont(barThick*1.0, 'bold');
        ctx.fillStyle = '#fef9ee';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(timeLeft.toString(), barX + barWidth/2, barProgressY + barThick/2);

        if (pct <= 0.22 && pct > 0) {
          ctx.fillStyle = 'rgba(200,70,50,'+(0.25+0.2*Math.sin(Date.now()/120))+')';
          roundRect(barX, barProgressY, barWidth * pct, barThick, barThick*0.4, true, false);
        }
      }

      function drawBackButton() {
        const bw = W * 0.2;
        const bh = Math.min(H * 0.045, 30);
        const bx = W - bw - W * 0.05;
        const by = H - bh - H * 0.02;
        ctx.fillStyle = '#e8d8b8';
        ctx.strokeStyle = '#8b7a5a';
        ctx.lineWidth = 1.5;
        roundRect(bx, by, bw, bh, 3, true, true);
        setFont(Math.max(10, bh * 0.42), 'bold');
        ctx.fillStyle = '#4a3020';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('↩ Quay lại', bx + bw/2, by + bh/2);
      }

      function drawBtn(x, y, w, h, text, bgColor, borderColor, icon = '', pulse = false) {
        const r = 3;
        ctx.fillStyle = bgColor;
        ctx.strokeStyle = borderColor;
        ctx.lineWidth = 1.8;
        roundRect(x, y, w, h, r, true, true);
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        roundRect(x + 3, y + 3, w - 6, h/3, r, true, false);
        const fontSize = Math.max(11, h * 0.40);
        setFont(fontSize, 'bold');
        ctx.fillStyle = '#ffffff';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(icon ? icon + ' ' + text : text, x + w/2, y + h/2);
        if (pulse) {
          ctx.fillStyle = 'rgba(255,255,200,'+(0.2+0.15*Math.sin(Date.now()/200))+')';
          roundRect(x, y, w, h, r, false, true);
        }
      }

      function drawCard(x, y, w, h, title, desc, icon, hs) {
        const r = 3;
        ctx.fillStyle = 'rgba(0,0,0,0.18)';
        roundRect(x + 2, y + 2, w, h, r, true, false);
        ctx.fillStyle = '#fef9ee';
        ctx.strokeStyle = '#b8a070';
        ctx.lineWidth = 1.3;
        roundRect(x, y, w, h, r, true, true);

        const iconSize = Math.min(h * 0.24, 22);
        setFont(iconSize, '');
        ctx.fillStyle = '#5c3a20';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(icon, x + w/2, y + h * 0.20);

        const titleSize = Math.max(10, w * 0.10);
        setFont(titleSize, 'bold');
        ctx.fillStyle = '#2e1c0c';
        ctx.fillText(title, x + w/2, y + h * 0.50);

        const descSize = Math.max(8, w * 0.07);
        setFont(descSize, '', 'italic');
        ctx.fillStyle = '#6b5a42';
        ctx.fillText(desc, x + w/2, y + h * 0.74);

        if (hs !== undefined && hs > 0) {
          setFont(Math.max(9, h * 0.12), 'bold');
          ctx.fillStyle = '#b8942e';
          ctx.textAlign = 'right';
          ctx.fillText('★' + hs, x + w - w*0.06, y + h*0.12);
        }
      }

      function drawOverlay(score) {
        ctx.fillStyle = 'rgba(14,10,6,0.88)';
        ctx.fillRect(0, 0, W, H);
        const ow = W * 0.78;
        const oh = H * 0.34;
        const ox = (W - ow) / 2;
        const oy = (H - oh) / 2;
        ctx.fillStyle = '#fef9ee';
        ctx.strokeStyle = '#8b7a5a';
        ctx.lineWidth = 2.8;
        roundRect(ox, oy, ow, oh, 6, true, true);

        setFont(oh * 0.2, 'bold');
        ctx.fillStyle = '#3e2a18';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('⏳ KẾT THÚC', W/2, oy + oh * 0.22);

        setFont(oh * 0.45, 'bold');
        ctx.fillStyle = '#8b3a3a';
        ctx.fillText(score.toString(), W/2, oy + oh * 0.5);

        drawBtn(W/2 - ow*0.35, oy + oh*0.68, ow*0.7, oh*0.24, 'Thử lại', '#8b3a3a', '#5a2020', '↺');
      }

      // ─── STATE ──────────────────────────────────────
      let currentView = 'menu';
      let highScores = JSON.parse(localStorage.getItem('la_hs_focus_v2') || '{}');
      function saveHS(id, s) { if (!highScores[id] || s > highScores[id]) { highScores[id] = s; localStorage.setItem('la_hs_focus_v2', JSON.stringify(highScores)); } }

      const gameTimers = [8, 8, 8, 8, 8, 8, 8, 8, 8, 8];
      let g = [];
      for (let i = 0; i < 10; i++) g.push({
        active: false, over: false, score: 0, level: 1, msg: '', msgC: '#6b6054',
        interval: null, timeout: null, gameTimer: gameTimers[i], gameInterval: null
      });

      function stopAll() {
        for (let i = 0; i < 10; i++) {
          if (g[i].interval) clearInterval(g[i].interval);
          if (g[i].timeout) clearTimeout(g[i].timeout);
          if (g[i].gameInterval) clearInterval(g[i].gameInterval);
          g[i].active = false;
          g[i].over = false;
        }
        distractionElements = [];
        shakeAmount = 0;
        noiseAlpha = 0;
      }

      function resetGame(i) {
        let o = g[i];
        o.active = false; o.over = false; o.score = 0; o.level = 1;
        o.msg = ''; o.msgC = '#6b6054'; o.gameTimer = gameTimers[i];
        if (o.interval) clearInterval(o.interval);
        if (o.timeout) clearTimeout(o.timeout);
        if (o.gameInterval) clearInterval(o.gameInterval);
        o.interval = null; o.timeout = null; o.gameInterval = null;
        switch (i) {
          case 0: o.base = 0; o.ops = []; o.result = 0; o.phase = 'mem'; o.timer = 1; o.showNum = 0; o.input = 0; break;
          case 1: o.grid = Array(9).fill(false); o.target = []; o.phase = 'show'; o.timer = 1; o.selected = -1; o.question = ''; break;
          case 2: o.word = ''; o.color = ''; o.phase = 'wait'; o.stimTimer = 0; o.waiting = false; o.correctAns = ''; break;
          case 3: o.seq = []; o.next = 0; o.phase = 'show'; o.showIdx = 0; o.input = 0; break;
          case 4: o.n = 2; o.history = []; o.phase = 'play'; o.pos = 0; o.letter = ''; o.posMatch = false; o.letterMatch = false; o.stimTimer = 0; o.waiting = false; break;
          case 5: o.chain = []; o.shownResult = 0; o.correctResult = 0; o.phase = 'show'; o.showIdx = 0; o.isCorrect = true; break;
          case 6: o.grid = Array(16).fill(0); o.phase = 'mem'; o.timer = 2; o.question = ''; o.correctAns = 0; o.choices = []; o.answered = false; break;
          case 7: o.nums = []; o.phase = 'show'; o.timer = 1; o.target = ''; o.sorted = []; o.correctAns = 0; o.choices = []; break;
          case 8: o.key = {}; o.encoded = []; o.decoded = 0; o.phase = 'mem'; o.timer = 2; o.showKey = true; o.input = 0; break;
          case 9: o.subGame = 0; o.totalTimer = 8; o.phase = 'play'; o.waiting = false; o.subData = {}; o.gameTimer = 8; break;
        }
      }

      function goToGame(i) {
        currentView = 'game' + i;
        stopAll();
        initAudio();
        resetGame(i);
        startGameTimer(i);
        switch (i) {
          case 0: startGame0(); break;
          case 1: startGame1(); break;
          case 2: startGame2(); break;
          case 3: startGame3(); break;
          case 4: startGame4(); break;
          case 5: startGame5(); break;
          case 6: startGame6(); break;
          case 7: startGame7(); break;
          case 8: startGame8(); break;
          case 9: startGame9(); break;
        }
        distractionTimer = 0;
        distractionElements = [];
        shakeAmount = 0;
        noiseAlpha = 0;
        drawAll();
        playClick();
      }

      function goToMenu() {
        currentView = 'menu';
        stopAll();
        drawAll();
        playClick();
      }

      function startGameTimer(i) {
        let o = g[i];
        if (o.gameInterval) clearInterval(o.gameInterval);
        o.gameInterval = setInterval(() => {
          updateDistractions();
          if (o.gameTimer > 0 && o.active && !o.over) {
            o.gameTimer--;
            if (o.gameTimer <= 3 && o.gameTimer > 0) playUrgent();
            drawAll();
          } else if (o.gameTimer <= 0 && o.active && !o.over) {
            o.over = true;
            o.active = false;
            if (o.interval) clearInterval(o.interval);
            if (o.timeout) clearTimeout(o.timeout);
            saveHS(i, o.score);
            drawAll();
            playError();
          }
        }, 1000);
      }

      function rewardCorrect(i) {
        let o = g[i];
        o.gameTimer = 8;
        if (i === 9) o.totalTimer = 8;
        if (o.timeout) { clearTimeout(o.timeout); o.timeout = null; }
      }

      const gameInfo = [
        { name: 'Memory Math', desc: 'Nhớ số, tính nhẩm', icon: 'M' },
        { name: 'Pattern Matrix', desc: 'Ghi nhớ ô mẫu', icon: '◈' },
        { name: 'Stroop', desc: 'Màu sắc xung đột', icon: '▣' },
        { name: 'Sequence', desc: 'Dãy số logic', icon: '⇉' },
        { name: 'Dual N-Back', desc: 'Vị trí & chữ cái', icon: '◫' },
        { name: 'Chain Math', desc: 'Chuỗi phép tính', icon: '↯' },
        { name: 'Grid Recall', desc: 'Nhớ lưới số', icon: '▦' },
        { name: 'Speed Sort', desc: 'Sắp xếp nhanh', icon: '»' },
        { name: 'Code Breaker', desc: 'Giải mã ký hiệu', icon: '⚿' },
        { name: 'Quick Switch', desc: 'Luân chuyển nhanh', icon: '↻' }
      ];

      // ─── MENU ──────────────────────────────────────
      function drawMenu() {
        drawParchmentBackground();
        const headerH = H * 0.13;
        const pad = W * 0.05;
        ctx.fillStyle = '#1c2a1c';
        roundRect(pad, pad*0.5, W - 2*pad, headerH, 5, true, false);
        const r = headerH * 0.42;
        const cx = pad + r * 1.8;
        const cy = pad*0.5 + headerH*0.5;
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI*2);
        ctx.fillStyle = '#f4ecd8';
        ctx.fill();
        ctx.strokeStyle = '#b8a56a';
        ctx.lineWidth = 2.5;
        ctx.stroke();

        setFont(r*1.2, 'bold');
        ctx.fillStyle = '#8b3a3a';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('L', cx, cy);

        // Dòng tiêu đề chính
        setFont(headerH*0.24, 'bold');
        ctx.fillStyle = '#e8e0c8';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText('HỌC VIỆN LOGIC', cx + r*1.9, cy - headerH*0.13);

        // Dòng mô tả
        setFont(headerH*0.14, '', 'italic');
        ctx.fillStyle = '#c8c0a8';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText('Tập trung tuyệt đối – 8 giây', cx + r*1.9, cy + headerH*0.12);

        const cols = 2, m = W*0.05, gap = W*0.022, rows = 5;
        const startY = H*0.18;
        const availableHeight = H - startY - H*0.1;
        const cw = (W - 2*m - gap) / cols;
        const ch = (availableHeight - (rows-1)*gap) / rows;
        for (let i = 0; i < 10; i++) {
          const col = i % cols, row = Math.floor(i / cols);
          drawCard(m + col*(cw+gap), startY + row*(ch+gap), cw, ch, gameInfo[i].name, gameInfo[i].desc, gameInfo[i].icon, highScores[i]);
        }
      }

      // ─── NUMERIC KEYPAD ────────────────────────────
      function drawNumPad(m, iw, y, nph) {
        const nps = (iw - W*0.08) / 3;
        for (let r = 0; r < 4; r++) {
          for (let c = 0; c < 3; c++) {
            const num = r * 3 + c + 1;
            if (num > 9) continue;
            const nx = m + c * (nps + W*0.04);
            const ny = y + r * (nph + H*0.012);
            ctx.fillStyle = '#f5f0e0';
            ctx.strokeStyle = '#8b7a5a';
            ctx.lineWidth = 1;
            roundRect(nx, ny, nps, nph, 3, true, true);
            setFont(nph*0.42, 'bold');
            ctx.fillStyle = '#2e1c0c';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(num.toString(), nx + nps/2, ny + nph/2);
          }
        }
        const zy = y + 4 * (nph + H*0.012);
        const nps2 = (iw - W*0.08) / 3;
        roundRect(m, zy, nps2, nph, 3, true, true);

          const cols = ['#d94a4a', '#3b6fb6', '#e0a82b']; const bw3 = (iw - W*0.04)/3;
          for (let i = 0; i < 3; i++) { const bx = m + i*(bw3 + W*0.02); if (x > bx && x < bx + bw3 && y > gy6 + H*0.13 && y < gy6 + H*0.21) { if (cols[i] === o.subData.correctColor) handleSuccess(); else handleFailure(); drawAll(); return; } }
        }
      }

      // ─── MAIN DRAW & EVENTS ─────────────────────────
      function drawAll() {
        ctx.save();
        if (shakeAmount > 0.08) {
          ctx.translate((Math.random() - 0.5) * shakeAmount, (Math.random() - 0.5) * shakeAmount);
        }
        if (currentView === 'menu') drawMenu();
        else if (currentView === 'game0') drawGame0(); else if (currentView === 'game1') drawGame1();
        else if (currentView === 'game2') drawGame2(); else if (currentView === 'game3') drawGame3();
        else if (currentView === 'game4') drawGame4(); else if (currentView === 'game5') drawGame5();
        else if (currentView === 'game6') drawGame6(); else if (currentView === 'game7') drawGame7();
        else if (currentView === 'game8') drawGame8(); else if (currentView === 'game9') drawGame9();
        ctx.restore();
      }
      function roundRect(x, y, w, h, r, fill = true, stroke = false) {
        if (w <= 0 || h <= 0) return;
        r = Math.min(r, w/2, h/2);
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
        if (fill) ctx.fill();
        if (stroke) ctx.stroke();
      }
      function setFont(size, weight = '', style = '') {
        let fs = ''; if (style) fs += style + ' '; if (weight) fs += weight + ' ';
        fs += Math.round(size) + 'px Arial, "Helvetica Neue", sans-serif';
        ctx.font = fs;
      }
      function getPos(e) { const rect = canvas.getBoundingClientRect(); return { x: (e.clientX - rect.left) * (W / rect.width), y: (e.clientY - rect.top) * (H / rect.height) }; }
      function handlePointerDown(e) {
        const { x, y } = getPos(e);
        if (currentView !== 'menu') { const bw = W*0.2, bh = Math.min(H*0.045, 30), bx = W - bw - W*0.05, by = H - bh - H*0.02; if (x > bx && x < bx + bw && y > by && y < by + bh) { goToMenu(); return; } }
        if (currentView === 'menu') { const cols = 2, m2 = W*0.05, gap = W*0.022, sy = H*0.18, rows = 5; const cw = (W - 2*m2 - gap) / cols, ch = (H - sy - H*0.1 - (rows-1)*gap) / rows; for (let i = 0; i < 10; i++) { const col = i%cols, row = Math.floor(i/cols); const cx = m2 + col*(cw+gap), cy = sy + row*(ch+gap); if (x > cx && x < cx + cw && y > cy && y < cy + ch) { goToGame(i); return; } } return; }
        const gi = parseInt(currentView.replace('game', ''));
        if (gi === 0) handleGame0(x, y); else if (gi === 1) handleGame1(x, y);
        else if (gi === 2) handleGame2(x, y); else if (gi === 3) handleGame3(x, y);
        else if (gi === 4) handleGame4(x, y); else if (gi === 5) handleGame5(x, y);
        else if (gi === 6) handleGame6(x, y); else if (gi === 7) handleGame7(x, y);
        else if (gi === 8) handleGame8(x, y); else if (gi === 9) handleGame9(x, y);
      }
      canvas.addEventListener('mousedown', handlePointerDown);
      canvas.addEventListener('touchstart', (e) => { e.preventDefault(); handlePointerDown(e.touches[0]); }, { passive: false });
      resizeCanvas();
      function animLoop() { animFrame++; drawAll(); requestAnimationFrame(animLoop); }
      requestAnimationFrame(animLoop);
    })();
  </script>
</body>
